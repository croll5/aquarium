<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../templates/bibliotheque.css">
    <link rel="stylesheet" href="../templates/commun_clair.css">
    <link rel="stylesheet" href="../css/config_extraction.css">
    <script src="../templates/bibliotheque.js"></script>
    <script src="../js/config_extraction.js" async></script>
</head>
<body>
    <h1>Configuration de « <strong id="nom_machine"></strong> »</h1>
    <div id="infos_peripheriques">
        <label for="nom_config">Nom de la configuration</label><br>
        <input type="text" name="nom_config" id="nom_config" class="input_clair"><br><br>
        <p>Envisagez-vous d’utiliser cette configuration pour une autre analyse ?</p>
        <input type="radio" name="utilisation" id="permanente" class="input_clair"><label for="permanente"> Oui</label><br>
        <input type="radio" name="utilisation" id="temporaire" class="input_clair"><label for="temporaire"> Non</label><br><br>
        <button class="bouton_sombre" onclick="valider_infos_config()">Valider</button>
    </div>
    <div id="arborescence"></div>
    <div class="menu_contextuel" id="menu_ajout">
        <button class="option_menu" onclick="afficher_popup_config_extraction()">✅ Sélectionner le dossier</button>
        <button class="option_menu" onclick="afficher_popup_select_fichiers()">🎯 Choisir les fichiers</button>
    </div>
    <div class="menu_contextuel" id="menu_suppression">
        <button class="option_menu" onclick="retrait_dossier()">🗑️ Désélectionner le dossier</button>
        <button class="option_menu">🎯 Modifier le choix des fichiers</button>
        <button class="option_menu">🛠️ Modifier la configuration d’extraction</button>
    </div>
    <div class="fond-popup" id="fond_popup"></div>
    <div class="cadre-popup" id="popup_select_fichiers">
        <button class="bouton_fermer" onclick="fermer_popup('popup_select_fichiers')">x</button>
        <h1 id="nom_dossier_cible">Erreur de chargement...</h1>
        <div id="zone_filtrage_fichiers">
            <div id="zone_recherche_fichiers">
                <input type="text" class="code" value="*" id="filtre_choix_fichiers">
                <button class="bouton_sombre" onclick="actualisation_fichiers_filtres()">🔎 Rechercher</button>
            </div>
            <div>
                <button class="bouton_sombre" id="valider_filtrage_fichiers">Valider la sélection</button>
            </div>
        </div>

        <div id="contenant_fichiers_filtres" onscroll="scroll_liste_fichiers()">
            <ul id="fichiers_filtres"></ul>
        </div>
    </div>
    <div class="cadre-popup" id="popup_select_config_extraction">
        <button class="bouton_fermer" onclick="fermer_popup('popup_select_config_extraction')">x</button>
        <h2>Quelle configuration voulez-vous utiliser ?</h2>
        <select name="" id="select_config_extraction">
            <option value="" selected disabled>----- Sélectionnez une configuration -----</option>
        </select>
        <button class="bouton_sombre" onclick="ajout_dossier()">Valider</button>
    </div>
</body>
</html>
