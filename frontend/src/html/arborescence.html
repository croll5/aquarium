<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../templates/bibliotheque.css">
    <link rel="stylesheet" href="../templates/commun_clair.css">
    <link rel="stylesheet" href="../css/arborescence.css">
    <script src="../js/arborescence.js" async></script>
    <script src="../templates/bibliotheque.js" async></script>
</head>
<body id="body_arbo">
    
    <h1>Arborescence de la machine analysée</h1>
    <p id="patientez">🫧 L'extraction est en cours. Vous pouvez patienter en salle d'attente 🫧</p>
    <div id="selection_arborescence">
        <select id="choix_arborescence" class="input_clair" onchange="extraire_arborescence()">
            <option value="" disabled selected>--- Arborescence à afficher ---</option>
        </select>
    </div>
    <iframe src="../assets/documents/MONTAUBAN_Albane_Memoire_M2.pdf" frameborder="0" id="document_pour_patienter"></iframe>
    <!--Légende des indicateurs de légitimité-->
    <div id="legende" style="display: none;">
        <h3>Choix des indicateurs de légitimité à afficher</h3>
        <input type="checkbox" id="affiche_inconnu" onchange="affichage_legitimite('affiche_inconnu', 'legitimite_aucune')" checked>
        <label for="affiche_inconnu">Fichiers non présents dans le modèle (😵)</label><br>
        <input type="checkbox" id="affiche_suspect" onchange="affichage_legitimite('affiche_suspect', 'legitimite_suspect')" checked>
        <label for="affiche_suspect">Fichiers présents dans le modèle avec une empreinte différente (🥴)</label><br>
        <input type="checkbox" id="affiche_ok" onchange="affichage_legitimite('affiche_ok', 'legitimite_ok')" checked>
        <label for="affiche_ok">Fichiers présents dans le modèle avec la même empreinte (😇)</label><br>
    </div>
    <h3>Arborescence</h3>
    <div id="arborescence">
        <!--On va ajouter les fichiers d'arborescence ici-->
    </div>
</body>
</html>
